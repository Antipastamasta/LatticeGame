<title>Lattice Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centred column. Header with live counts, the square board, then controls and settings. */
:root {
  color-scheme: light;
  --bg: #f6f7f5;
  --paper: #ffffff;
  --ink: #15171c;
  --muted: #6b7078;
  --line: #dfe2e0;
  --bad: #e5484d;
  --good: #1f9d63;
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); padding: 20px 16px 32px; }
.app { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: -0.02em; margin: 0; line-height: 1; }
.puzzle-id { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 6px; }
.stats { display: flex; gap: 18px; align-items: flex-end; }
.stat { display: grid; gap: 2px; text-align: right; }
.stat b { font-family: var(--mono); font-weight: 500; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; }
.stat span { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

.board-wrap { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; aspect-ratio: 1; max-width: 100%; overflow: hidden; }
svg#board { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }

.msg { min-height: 22px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); text-align: center; transition: color .2s; }
.msg.bad { color: var(--bad); }
.msg.good { color: var(--good); font-weight: 600; }

.controls { display: flex; gap: 8px; flex-wrap: nowrap; justify-content: center; }
.controls button { white-space: nowrap; flex: 0 1 auto; min-width: 0; }
#solveBtn[aria-pressed="true"] { border-color: var(--good); color: var(--good); }
@media (max-width: 480px) { .controls { gap: 6px; } .controls button { padding: 9px 12px; font-size: 13.5px; } }
@media (max-width: 350px) { .controls { gap: 5px; } .controls button { padding: 8px 9px; font-size: 12.5px; } }
button, select { font: 500 14px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
button:hover:not(:disabled), select:hover { border-color: var(--ink); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.stat-diff { position: relative; }
.diff-btn { all: unset; display: grid; gap: 2px; text-align: right; cursor: pointer; border-radius: 6px; }
.diff-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
.diff-btn span { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.diff-btn svg { width: 8px; height: 5px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
.diff-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.diff-btn:hover b { color: var(--muted); }
.diff-menu { position: absolute; top: calc(100% + 10px); right: -8px; z-index: 30; min-width: 212px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 40px rgba(21, 23, 28, .14), 0 2px 6px rgba(21, 23, 28, .06); padding: 6px; display: grid; gap: 2px; transform-origin: top right; animation: menuIn .18s cubic-bezier(.2, .9, .3, 1.2); }
.diff-menu[hidden] { display: none; }
.diff-opt { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 16px; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 11px; cursor: pointer; text-align: left; }
.diff-opt:hover { background: var(--bg); }
.diff-opt:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.diff-opt .name { font: 500 17px var(--mono); color: var(--ink); text-transform: none; letter-spacing: 0; }
.diff-opt .meta { font: 400 11.5px var(--mono); color: var(--muted); letter-spacing: .02em; text-transform: none; }
.diff-opt .tick { width: 14px; height: 14px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.diff-opt[aria-selected="true"] .tick { opacity: 1; }
@keyframes menuIn { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
@media (prefers-reduced-motion: reduce) { .diff-menu { animation: none; } }
select { padding: 7px 12px; }


.win { background: var(--ink); color: var(--paper); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; animation: rise .35s ease-out; }
.win strong { font-family: var(--display); font-size: 20px; display: block; }
.win small { font-size: 13px; opacity: .75; }
.win button { background: var(--paper); color: var(--ink); border-color: var(--paper); white-space: nowrap; }
.stars { font-size: 18px; letter-spacing: 2px; }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

/* board styling */
.dot { fill: var(--ink); }
.seg { stroke: var(--ink); stroke-width: 0.075; stroke-linecap: round; }
.seg.new { animation: draw .22s ease-out; }
.preview { stroke-width: 0.05; stroke-linecap: round; stroke-dasharray: 0.12 0.12; }
.circle-piece { transition: transform .35s cubic-bezier(.2,.9,.3,1.3); }
.hint-ring { fill: none; stroke: var(--ink); stroke-width: 0.035; stroke-dasharray: 0.08 0.07; }
.solution { stroke: var(--good); stroke-width: 0.06; stroke-dasharray: 0.16 0.1; stroke-linecap: round; fill: none; opacity: .9; }
.start-halo { fill: none; stroke: var(--good); stroke-width: 0.06; }
.end-ring { fill: none; stroke: var(--bad); stroke-width: 0.06; }
@keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
.next-halo { animation: pulse 1.6s ease-in-out infinite; }
@keyframes draw { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .next-halo, .seg.new, .win { animation: none; } .circle-piece { transition: none; } }
@media (max-width: 380px) { header { gap: 6px; } h1 { font-size: 22px !important; } .stats { gap: 8px !important; } .stat span { letter-spacing: .04em; } .home-btn { width: 28px; height: 28px; } }
@media (max-width: 420px) { h1 { font-size: 26px; } .stats { gap: 12px; } .stat b { font-size: 19px; } }
.help-row { display: flex; justify-content: center; border-top: 1px solid var(--line); padding-top: 14px; }
.help-btn { display: inline-flex; align-items: center; gap: 8px; }
.help-btn i { font-style: normal; font-family: var(--display); font-weight: 700; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: 13px; }

/* tutorial modal */
.tut { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: minmax(0, 460px); justify-content: center; align-content: center; padding: 16px; background: rgba(21, 23, 28, .38); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: tutFade .25s ease-out; }
.tut-card { position: relative; width: 100%; min-width: 0; box-sizing: border-box; max-width: 460px; background: var(--paper); border-radius: 20px; padding: 18px 18px 16px; box-shadow: 0 24px 60px rgba(21, 23, 28, .22); display: grid; gap: 14px; animation: tutPop .35s cubic-bezier(.2, .9, .3, 1.15); }
.tut-top { display: flex; align-items: center; justify-content: space-between; }
.tut-step { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.tut-x { width: 34px; height: 34px; padding: 0; border-radius: 50%; display: grid; place-items: center; border-color: transparent; background: transparent; }
.tut-x:hover { background: var(--bg); }
.tut-x svg { width: 16px; height: 16px; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.tut-stage { position: relative; background: var(--bg); border-radius: 14px; aspect-ratio: 5.2 / 4.2; overflow: hidden; touch-action: pan-y; }
.tut-stage svg { display: block; width: 100%; height: 100%; }
.tut-hud { position: absolute; top: 10px; right: 12px; font-family: var(--mono); font-size: 12.5px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; transition: opacity .3s; }
.tut-hud .gold { color: #e0a100; letter-spacing: 1px; }
.tut-cap { font-family: var(--display); font-weight: 500; font-size: 19px; line-height: 1.3; letter-spacing: -0.01em; text-align: center; text-wrap: balance; min-height: 2.6em; margin: 0; display: grid; place-items: center; }
.tut-cap.enter { animation: capIn .45s ease-out; }
.tut-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tut-arrow { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
.tut-arrow svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tut-arrow.primary { color: var(--paper); }
.tut-play { padding: 0 20px; height: 44px; }
.tut-dots { display: flex; gap: 7px; }
.tut-dots button { width: 8px; height: 8px; padding: 0; border-radius: 4px; border: 0; background: var(--line); transition: width .3s, background .3s; }
.tut-dots button.on { width: 22px; background: var(--ink); }
.tut .finger { fill: var(--ink); fill-opacity: .14; stroke: var(--ink); stroke-width: .03; }
.tut[hidden], .tut-hud[hidden] { display: none; }
@keyframes tutFade { from { opacity: 0; } }
@keyframes tutPop { from { transform: translateY(10px) scale(.97); opacity: 0; } }
@keyframes capIn { from { transform: translateY(6px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tut, .tut-card, .tut-cap.enter { animation: none; } }
@media (max-width: 420px) { .tut-cap { font-size: 17px; } }
/* sound toggle */
.sound-btn { width: 40px; height: 40px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
.sound-btn svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sound-btn .spk { fill: var(--ink); }
.sound-btn .mute { display: none; }
.sound-btn.off .wave { display: none; }
.sound-btn.off .mute { display: inline; }
.sound-btn.off svg { stroke: var(--muted); } .sound-btn.off .spk { fill: var(--muted); }
.sound-corner { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; border-color: transparent; background: transparent; }
.sound-corner:hover:not(:disabled) { border-color: var(--line); }
.hap-corner { right: 60px; }
.sound-btn .hap-body { fill: none; }
.hap-btn[hidden] { display: none !important; }
.hap-tap { position: absolute; inset: 0; border-radius: inherit; cursor: inherit; -webkit-tap-highlight-color: transparent; }
.hap-tap.hap-board { position: static; display: contents; }
.hap-switch { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; opacity: 0; overflow: hidden; clip-path: inset(50%); pointer-events: none; }
.hap-ios #board > * { pointer-events: none; }
.help-row { gap: 10px; align-items: center; }

/* free version + unlock */
.unlock-link { border-color: transparent; background: transparent; color: var(--muted); font-size: 14px; padding: 8px 12px; text-decoration: underline; text-underline-offset: 3px; }
.unlock-link:hover:not(:disabled) { border-color: transparent; color: var(--ink); }
.title-actions .unlock-link { padding: 8px 12px; font-size: 14px; }
.pips { display: inline-flex; gap: 5px; vertical-align: middle; margin-left: 7px; position: relative; top: -1px; }
.pips button { width: 8px; height: 8px; padding: 0; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; }
.pips button.solved { background: var(--good); border-color: var(--good); }
.pips button.current { border-color: var(--ink); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink); }
.lock-card { text-align: center; justify-items: center; }
.lock-card .tut-top { width: 100%; }
.lock-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; }
.lock-icon svg { width: 34px; height: 34px; fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; }
.lock-icon circle { fill: var(--ink); stroke: none; }
.lock-card h3 { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -0.02em; margin: 0; }
.lock-card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; max-width: 34ch; text-wrap: balance; }
.lock-perks { list-style: none; padding: 0; margin: 2px 0; display: grid; gap: 6px; font-size: 14px; text-align: left; }
.lock-perks li { display: flex; gap: 8px; align-items: baseline; }
.lock-perks li::before { content: "✓"; color: var(--good); font-weight: 700; }
.lock-actions { display: grid; gap: 8px; width: 100%; max-width: 260px; }
.lock-actions button { padding: 13px 18px; font-size: 15px; }
.lock-actions .primary { font-family: var(--display); font-weight: 700; font-size: 17px; }
.lock-card .lock-note { font-size: 12px; font-family: var(--mono); }

/* title screen */
.app[hidden], .title-screen[hidden] { display: none; }
.title-screen { min-height: calc(100vh - 52px); min-height: calc(100dvh - 52px); display: grid; place-items: center; }
.title-inner { display: grid; justify-items: center; gap: 22px; text-align: center; width: 100%; max-width: 360px; }
.emblem { width: min(240px, 64vw); aspect-ratio: 1; }
.emblem svg { width: 100%; height: 100%; display: block; overflow: visible; }
.emblem .e-path { fill: none; stroke: var(--ink); stroke-width: .075; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; animation: eDraw 7s cubic-bezier(.6, 0, .3, 1) infinite; }
.emblem .e-circle { animation: eBreathe 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes eDraw { 0% { stroke-dashoffset: 1; opacity: 1; } 45%, 85% { stroke-dashoffset: 0; opacity: 1; } 95%, 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes eBreathe { 0%, 100% { opacity: 1; } 50%, 85% { opacity: .38; } }
.game-title { font-family: var(--display); font-weight: 700; font-size: clamp(48px, 15vw, 68px); letter-spacing: -0.035em; line-height: .95; margin: 0; }
.title-actions { display: grid; gap: 10px; width: 100%; max-width: 240px; margin-top: 6px; }
.title-actions button { padding: 14px 20px; font-size: 16px; justify-content: center; }
.title-actions .primary { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .01em; }
.title-screen.leaving { animation: leave .3s ease-in forwards; }
.app.entering { animation: enter .4s ease-out; }
@keyframes leave { to { opacity: 0; transform: scale(.98); } }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
.title-row { display: flex; align-items: center; gap: 8px; }
.home-btn { width: 32px; height: 32px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
.home-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { .emblem .e-path, .emblem .e-circle, .title-screen.leaving, .app.entering { animation: none; } .emblem .e-path { stroke-dashoffset: 0; } }
</style>

<section class="title-screen" id="titleScreen">
  <button id="hapBtnTitle" type="button" class="sound-btn sound-corner hap-corner hap-btn" aria-label="Vibration" hidden><svg viewBox="0 0 20 20"><rect class="hap-body" x="6.5" y="3" width="7" height="14" rx="1.8"/><path class="wave" d="M3.6 7.5v5M1.6 8.8v2.4M16.4 7.5v5M18.4 8.8v2.4"/><path class="mute" d="M3.5 3.5l13 13"/></svg></button>
  <button id="soundBtnTitle" type="button" class="sound-btn sound-corner" aria-label="Sound"><svg viewBox="0 0 20 20"><path class="spk" d="M3.5 7.5h3l4-3.5v12l-4-3.5h-3z"/><path class="wave" d="M13.5 7.2a4 4 0 0 1 0 5.6M15.8 5a7 7 0 0 1 0 10"/><path class="mute" d="M13.5 7.5l5 5M18.5 7.5l-5 5"/></svg></button>
  <div class="title-inner">
    <div class="emblem" aria-hidden="true"><svg id="emblem"></svg></div>
    <h2 class="game-title" data-game-name>Lattice</h2>
    <div class="title-actions">
      <button id="playBtn" type="button" class="primary">Play</button>
      <button id="titleHelpBtn" type="button" class="help-btn"><i>?</i>How to play</button>
      <button id="titleUnlockBtn" type="button" class="unlock-link">Unlock the full game</button>
      <button id="relockBtn" type="button" class="unlock-link" hidden>Back to free version (testing)</button>
    </div>
  </div>
</section>

<div class="app" id="app" hidden>
  <header>
    <div>
      <div class="title-row">
        <button id="homeBtn" type="button" class="home-btn" aria-label="Back to title screen"><svg viewBox="0 0 20 20"><path d="M12.5 4l-6 6 6 6"/></svg></button>
        <h1 data-game-name>Lattice</h1>
      </div>
      <div class="puzzle-id" id="puzzleId">Puzzle</div>
    </div>
    <div class="stats">
      <div class="stat stat-diff">
        <select id="diffSel" aria-hidden="true" tabindex="-1" hidden>
          <option value="0">Easy</option>
          <option value="1" selected>Medium</option>
          <option value="2">Hard</option>
          <option value="3">Expert</option>
        </select>
        <button id="diffBtn" type="button" class="diff-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Difficulty">
          <b id="diffVal">Medium</b>
          <span>Difficulty<svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></span>
        </button>
        <div class="diff-menu" id="diffMenu" role="listbox" aria-label="Difficulty" hidden></div>
      </div>
      <div class="stat"><b id="segCount">0</b><span>Lines</span></div>
      <div class="stat"><b id="parCount">–</b><span>Par</span></div>
      <div class="stat"><b id="leftCount">0</b><span>Left</span></div>
    </div>
  </header>

  <div class="board-wrap" id="boardWrap">
    <svg id="board" aria-label="Puzzle board"></svg>
  </div>

  <div class="msg" id="msg" role="status">Tap dots to draw from green to red.</div>

  <div class="controls">
    <button id="undoBtn" type="button">Undo</button>
    <button id="resetBtn" type="button">Reset</button>
    <button id="solveBtn" type="button" aria-pressed="false">Solution</button>
    <button id="newBtn" type="button" class="primary">New puzzle</button>
  </div>

  <div class="help-row">
    <button id="helpBtn" type="button" class="help-btn"><i>?</i>How to play</button>
    <button id="hapBtn" type="button" class="sound-btn hap-btn" aria-label="Vibration" hidden><svg viewBox="0 0 20 20"><rect class="hap-body" x="6.5" y="3" width="7" height="14" rx="1.8"/><path class="wave" d="M3.6 7.5v5M1.6 8.8v2.4M16.4 7.5v5M18.4 8.8v2.4"/><path class="mute" d="M3.5 3.5l13 13"/></svg></button>
    <button id="soundBtn" type="button" class="sound-btn" aria-label="Sound"><svg viewBox="0 0 20 20"><path class="spk" d="M3.5 7.5h3l4-3.5v12l-4-3.5h-3z"/><path class="wave" d="M13.5 7.2a4 4 0 0 1 0 5.6M15.8 5a7 7 0 0 1 0 10"/><path class="mute" d="M13.5 7.5l5 5M18.5 7.5l-5 5"/></svg></button>
  </div>

</div>

  <div class="tut" id="lock" hidden role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="tut-card lock-card">
      <div class="tut-top">
        <span class="tut-step">Full game</span>
        <button class="tut-x" id="lockClose" type="button" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
      </div>
      <div class="lock-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="11" y="21" width="26" height="19" rx="4"/><path d="M17 21v-5a7 7 0 0 1 14 0v5"/><circle cx="24" cy="30.5" r="2.4"/></svg></div>
      <h3 id="lockTitle">Unlock Lattice</h3>
      <p id="lockText">Get endless new puzzles on every difficulty.</p>
      <ul class="lock-perks">
        <li>Unlimited puzzles on Easy, Medium, Hard and Expert</li>
        <li>One-time purchase, yours to keep</li>
      </ul>
      <div class="lock-actions">
        <button id="buyBtn" type="button" class="primary"></button>
        <button id="restoreBtn" type="button">Restore purchase</button>
      </div>
      <p class="lock-note" id="lockNote">Demo only. No payment is taken.</p>
    </div>
  </div>

  <div class="tut" id="tut" hidden role="dialog" aria-modal="true" aria-labelledby="tutCap">
    <div class="tut-card">
      <div class="tut-top">
        <span class="tut-step" id="tutStep">1 / 6</span>
        <button class="tut-x" id="tutClose" type="button" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
      </div>
      <div class="tut-stage" id="tutStage">
        <svg id="tutSvg" viewBox="-0.6 -0.6 5.2 4.2" aria-hidden="true"></svg>
        <div class="tut-hud" id="tutHud" hidden></div>
      </div>

<script>
// ===== CORE (pure game logic, no DOM) =====
// Par is drawn from a range per difficulty; circles scale with par.
const DIFFS = [
  { name: "Easy",   par: [2, 4], perLine: 1.5 },
  { name: "Medium", par: [3, 5], perLine: 1.8 },
  { name: "Hard",   par: [4, 6], perLine: 2.0 },
  { name: "Expert", par: [5, 7], perLine: 2.3 },
];
const SLICE_MARGIN = 0.06;   // a line must pass at least this far inside the rim to count
const DOT_CLEAR = 0.13;      // gap between a circle's rim and any lattice dot
const CIRCLE_GAP = 0.08;     // gap between circles
const EXACT_MAX = 4;         // up to this many lines the solver tries every route
const SOLVER_MAX = 6;
const GAME_NAME = "Lattice";
const FREE_SEEDS = [1001, 1004, 1002, 1003, 1000];   // the 5 free puzzles per difficulty, easiest first
const PRICE_LABEL = "$2.99";                         // web price label; the app shows the store's local price
// In-app purchase, via RevenueCat. The public SDK keys are safe to ship in the app; empty until RevenueCat is set up.
const RC_KEY_IOS = "";                               // RevenueCat Apple app key, starts with "appl_"
const RC_KEY_ANDROID = "";                           // RevenueCat Google app key, starts with "goog_"
const UNLOCK_ENTITLEMENT = "full";                   // RevenueCat entitlement granted by the lattice_full_unlock product
const GRID_SIZE = 6;           // fixed for now; generate() and the board still handle any size        // beyond EXACT_MAX it only tries routes where each line slices something new

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Exact integer geometry for lattice points
function orient(a, b, c) {
  const v = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
  return v > 0 ? 1 : v < 0 ? -1 : 0;
}
function onSeg(a, b, p) {
  return Math.min(a[0], b[0]) <= p[0] && p[0] <= Math.max(a[0], b[0]) &&
         Math.min(a[1], b[1]) <= p[1] && p[1] <= Math.max(a[1], b[1]);
}
// Closed segments: touching counts as intersecting
function segsTouch(p1, p2, p3, p4) {
  const o1 = orient(p1, p2, p3), o2 = orient(p1, p2, p4);
  const o3 = orient(p3, p4, p1), o4 = orient(p3, p4, p2);
  if (o1 !== o2 && o3 !== o4) return true;
  if (o1 === 0 && onSeg(p1, p2, p3)) return true;
  if (o2 === 0 && onSeg(p1, p2, p4)) return true;
  if (o3 === 0 && onSeg(p3, p4, p1)) return true;
  if (o4 === 0 && onSeg(p3, p4, p2)) return true;
  return false;
}
const same = (a, b) => a[0] === b[0] && a[1] === b[1];

// Can q be appended to path? Returns null if fine, or a reason string.
function checkMove(path, q) {
  const last = path[path.length - 1];
  if (same(last, q)) return "same";
  for (const p of path) if (same(p, q)) return "revisit";
  const n = path.length;
  if (n >= 2) {
    const prev = path[n - 2];
    // Doubling back along the previous line
    if (orient(prev, last, q) === 0 &&
        (prev[0] - last[0]) * (q[0] - last[0]) + (prev[1] - last[1]) * (q[1] - last[1]) > 0) return "overlap";
  }
  for (let i = 0; i + 1 < n - 1; i++) {
    if (segsTouch(path[i], path[i + 1], last, q)) return "cross";
  }
  return null;
}

function distPointSeg(c, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L2 = dx * dx + dy * dy;
  let t = L2 ? ((c[0] - a[0]) * dx + (c[1] - a[1]) * dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  const px = a[0] + t * dx - c[0], py = a[1] + t * dy - c[1];
  return Math.sqrt(px * px + py * py);
}
function slices(circle, a, b) {
  return distPointSeg([circle.x, circle.y], a, b) < circle.r - SLICE_MARGIN;
}

function randomPath(n, k, R) {
  const ri = () => Math.floor(R() * n);
  const path = [[ri(), ri()]];
  for (let s = 0; s < k; s++) {
    let placed = false;
    for (let t = 0; t < 80 && !placed; t++) {
      const q = [ri(), ri()], last = path[path.length - 1];
      const dx = q[0] - last[0], dy = q[1] - last[1];
      if (dx * dx + dy * dy < 5) continue;                       // segments at least ~2.2 apart
      if (checkMove(path, q)) continue;
      if (path.length >= 2 && orient(path[path.length - 2], last, q) === 0) continue; // must turn
      path.push(q); placed = true;
    }
    if (!placed) return null;
  }
  return path;
}

function placeCircles(n, path, count, R) {
  const circles = [];
  const nSegs = path.length - 1;
  for (let i = 0; i < count; i++) {
    const s = i % nSegs;                       // spread circles so every line has work to do
    const a = path[s], b = path[s + 1];
    let ok = false;
    for (let t = 0; t < 300 && !ok; t++) {
      const r = 0.24 + R() * 0.2;
      const u = 0.1 + R() * 0.8;
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len;
      const off = (R() * 2 - 1) * (r - 0.16);
      const c = { x: a[0] + u * (b[0] - a[0]) + nx * off, y: a[1] + u * (b[1] - a[1]) + ny * off, r };
      if (c.x - r < 0.05 || c.y - r < 0.05 || c.x + r > n - 1.05 || c.y + r > n - 1.05) continue;
      let bad = false;
      // keep clear of every lattice dot
      const x0 = Math.floor(c.x - 1), x1 = Math.ceil(c.x + 1), y0 = Math.floor(c.y - 1), y1 = Math.ceil(c.y + 1);
      for (let x = x0; x <= x1 && !bad; x++) for (let y = y0; y <= y1 && !bad; y++) {
        if (Math.hypot(c.x - x, c.y - y) < r + DOT_CLEAR) bad = true;
      }
      for (const o of circles) if (Math.hypot(c.x - o.x, c.y - o.y) < r + o.r + CIRCLE_GAP) { bad = true; break; }
      if (!bad && !slices(c, a, b)) bad = true;
      if (!bad) { circles.push(c); ok = true; }
    }
    if (!ok) return null;
  }
  return circles;
}

// Exhaustive search for the shortest valid path using at most maxSegs lines.
function solve(n, start, end, circles, maxSegs) {
  const N = n * n, full = (1 << circles.length) - 1;
  const pts = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) pts.push([x, y]);
  const masks = new Int32Array(N * N);
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    let m = 0;
    for (let c = 0; c < circles.length; c++) if (slices(circles[c], pts[i], pts[j])) m |= 1 << c;
    masks[i * N + j] = masks[j * N + i] = m;
  }
  const id = p => p[1] * n + p[0];
  const endId = id(end);
  const bits = m => { let c = 0; while (m) { m &= m - 1; c++; } return c; };
  let maxSlice = 1;
  for (let i = 0; i < masks.length; i++) if (masks[i]) maxSlice = Math.max(maxSlice, bits(masks[i]));
  let found = null, greedy = false;
  function dfs(path, mask, left) {
    const cur = id(path[path.length - 1]);
    if (left === 1) {
      if ((mask | masks[cur * N + endId]) === full && !checkMove(path, end)) found = path.concat([end]);
      return;
    }
    if (bits(full & ~mask) > left * maxSlice) return;   // not enough lines left to slice the rest
    for (let q = 0; q < N && !found; q++) {
      if (q === endId || q === cur) continue;
      const nm = mask | masks[cur * N + q];
      if (greedy && nm === mask) continue;
      if (checkMove(path, pts[q])) continue;
      path.push(pts[q]);
      dfs(path, nm, left - 1);
      path.pop();
    }
  }
  for (let L = 1; L <= maxSegs && !found; L++) { greedy = L > EXACT_MAX; dfs([start], 0, L); }
  return found;
}

function generate(n, diffIdx, seed) {
  const d = DIFFS[diffIdx];
  const R = mulberry32(seed);
  const segs = d.par[0] + Math.floor(R() * (d.par[1] - d.par[0] + 1));
  const count = Math.round(segs * d.perLine);
  let fallback = null;
  for (let attempt = 0; attempt < 400; attempt++) {
    const path = randomPath(n, segs, R);
    if (!path) continue;
    const circles = placeCircles(n, path, count, R);
    if (!circles) continue;
    const start = path[0], end = path[path.length - 1];
    if (Math.hypot(start[0] - end[0], start[1] - end[1]) < n / 3) continue;   // keep start and finish apart
    const depth = Math.min(segs - 1, SOLVER_MAX);
    const shorter = solve(n, start, end, circles, depth);
    if (!shorter) {
      return { n, start, end, circles, par: segs, solution: path, proven: segs - 1 <= EXACT_MAX, seed, diff: diffIdx };
    }
    if (!fallback || shorter.length > fallback.solution.length) {
      fallback = { n, start, end, circles, par: shorter.length - 1, solution: shorter, proven: shorter.length - 2 <= EXACT_MAX, seed, diff: diffIdx };
    }
  }
  return fallback;
}
// ===== END CORE =====
if (typeof module !== "undefined") { module.exports = { generate, solve, checkMove, slices, DIFFS }; }
</script>

<script>
// ===== SOUND: soft synthesized effects (Web Audio, no files) =====
const SFX = (function () {
  if (typeof window === "undefined") return {};
  const AC = window.AudioContext || window.webkitAudioContext;
  let on = true;
  try { on = localStorage.getItem("lattice.sound") !== "0"; } catch (e) {}
  let ctx = null, master = null, dry = null, wet = null, noise = null;
  // D major pentatonic, rising as you slice more circles
  const NOTES = [587.33, 659.25, 739.99, 880, 987.77, 1174.66, 1318.51, 1479.98, 1760, 1975.53];

  function init() {
    if (ctx || !AC) return ctx;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.55;
    const warm = ctx.createBiquadFilter(); warm.type = "lowpass"; warm.frequency.value = 7000;
    master.connect(warm).connect(ctx.destination);
    dry = ctx.createGain(); dry.connect(master);
    // a small, soft room
    const verb = ctx.createConvolver(), len = ctx.sampleRate * 1.8, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    verb.buffer = ir;
    wet = ctx.createGain(); wet.gain.value = 0.32; wet.connect(verb).connect(master);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    return ctx;

    if (!on || !init()) return false;
    if (ctx.state === "suspended") ctx.resume();

  }

    g.gain.setValueAtTime(0.0001, t);

    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);

    node.connect(dry);

  }
  function noiseBurst(t, { type = "bandpass", freq, q = 1, peak, attack = 0.001, decay, sweepTo, wetAmt = 0.2 }) {
    const src = ctx.createBufferSource(); src.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + attack + decay);
    const g = ctx.createGain(); env(g, t, peak, attack, decay);
    src.connect(f).connect(g); out(g, wetAmt);
    src.start(t, Math.random() * 0.5); src.stop(t + attack + decay + 0.05);
  }
  function tone(t, { freq, to, type = "sine", peak, attack = 0.002, decay, wetAmt = 0.3 }) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + attack + decay);
    const g = ctx.createGain(); env(g, t, peak, attack, decay);
    o.connect(g); out(g, wetAmt);
    o.start(t); o.stop(t + attack + decay + 0.05);
  }

  // a hollow wooden "tok": no noise at all, just the block's resonant modes ringing out briefly,
  // with a soft rubber-mallet onset and a tiny downward settle in pitch
  function wood(t, f, level) {
    tone(t, { freq: f, to: f * 0.965, peak: 0.26 * level, attack: 0.004, decay: 0.075, wetAmt: 0.32 });
    tone(t, { freq: f * 2.31, to: f * 2.25, peak: 0.045 * level, attack: 0.003, decay: 0.03, wetAmt: 0.2 });
    tone(t, { freq: f * 0.5, to: f * 0.48, peak: 0.08 * level, attack: 0.004, decay: 0.045, wetAmt: 0.2 });
  }

  return {
    get on() { return on; },
    toggle() {
      on = !on;
      try { localStorage.setItem("lattice.sound", on ? "1" : "0"); } catch (e) {}
      if (on) this.ui();
      return on;
    },
    // placing a dot: a muted woodblock tap
    tap() {
      if (!ready()) return;
      wood(ctx.currentTime + 0.005, 820, 1);
    },
    // cutting a circle: a quiet glassy chime
    slice(i = 0, delay = 0) {
      if (!ready()) return; const t = ctx.currentTime + 0.01 + delay;
      const n = NOTES[i % NOTES.length];
      tone(t + 0.03, { freq: n, peak: 0.1, attack: 0.006, decay: 1.4, wetAmt: 0.6 });
      tone(t + 0.03, { freq: n * 2.003, peak: 0.018, attack: 0.004, decay: 0.7, wetAmt: 0.6 });

    // a move that isn't allowed: two low, dull knocks
    bad() {

      wood(t, 470, 0.85);
      wood(t + 0.11, 420, 0.7);
    },
    // undo: a softer, lower tap
    undo() {
      if (!ready()) return; const t = ctx.currentTime + 0.005;
      wood(t, 640, 0.75);
    },
    // buttons: a tiny, muted tick
    ui() {
      if (!ready()) return; const t = ctx.currentTime + 0.005;
      wood(t, 1150, 0.22);

      tone(t + 0.16, { freq: NOTES[1] / 2, peak: 0.06, attack: 0.01, decay: 1.3, wetAmt: 0.5 });
    },
  };
})();

// Haptics: small taps that follow the sounds. Uses the native Capacitor plugin when the

  let on = true;
  try { on = localStorage.getItem("lattice.haptics") !== "0"; } catch (e) {}
  const native = () => window.Capacitor?.Plugins?.Haptics;
  const canVibrate = typeof navigator !== "undefined" && typeof navigator.vibrate === "function";
  const isIOS = typeof navigator !== "undefined" &&
    (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));
  const touch = typeof matchMedia === "function" && matchMedia("(pointer: coarse)").matches;
  const supported = !!native() || (touch && (canVibrate || isIOS));
  const iosTap = isIOS && !native() && !canVibrate;
  let want = false, label = null;
  function iosTick() {

      label.setAttribute("aria-hidden", "true");
      label.style.display = "none";

    if (n) { n.impact({ style: strength.toUpperCase() }).catch(() => {}); return; }
    if (canVibrate) { try { navigator.vibrate(ms); } catch (e) {} return; }
    if (isIOS) { try { iosTick(); } catch (e) {} }

  }

    input.tabIndex = -1; input.className = "hap-switch";

      if (on) at(0, "medium", 14);

    tap() { at(0, "light", 8); },
    slice(i = 0, delay = 0) { at(0.04 + delay, "medium", 16); },
    bad() { at(0, "medium", 12); at(0.11, "light", 10); },
    undo() { at(0, "light", 6); },
    ui() { at(0, "light", 5); },
    win(stars = 3) {

      return owns((await rc().restorePurchases()).customerInfo);
    },
    cancelled: e => !!(e && (e.userCancelled || String(e.code) === "1" || e.data?.userCancelled)),
  };
})();
</script>

<script>
if (typeof document !== "undefined") (function () {
  const PALETTE = ["#ff5a5f", "#ffb020", "#12a594", "#3e63dd", "#8e4ec6", "#30a46c", "#e93d82", "#0091ff", "#f76b15", "#46a758"];
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("board");
  const $ = id => document.getElementById(id);
  const S = { level: null, path: [], hover: null, done: false, showSol: false, newSeg: false, lastBad: null };

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function slicedSet(path) {
    const L = S.level, set = new Map();
    for (let s = 0; s + 1 < path.length; s++) {
      L.circles.forEach((c, i) => { if (!set.has(i) && slices(c, path[s], path[s + 1])) set.set(i, s); });
    }
    return set;
  }

  function setMsg(text, kind) { const m = $("msg"); m.textContent = text; m.className = "msg" + (kind ? " " + kind : ""); }

  function render() {
    const L = S.level, n = L.n, pad = 0.6;
    svg.setAttribute("viewBox", `${-pad} ${-pad} ${n - 1 + 2 * pad} ${n - 1 + 2 * pad}`);
    svg.textContent = "";
    const defs = el("defs", {}, svg);
    const sliced = slicedSet(S.path);
    const last = S.path[S.path.length - 1];

    // preview data
    let prevBad = null, prevSlices = new Set();
    if (S.hover && !S.done && !same(S.hover, last)) {
      prevBad = checkMove(S.path, S.hover);
      L.circles.forEach((c, i) => { if (!sliced.has(i) && slices(c, last, S.hover)) prevSlices.add(i); });
    }

    // circles
    const gC = el("g", {}, svg);
    L.circles.forEach((c, i) => {
      const color = PALETTE[i % PALETTE.length];
      if (sliced.has(i)) {
        const s = sliced.get(i), a = S.path[s], b = S.path[s + 1];
        const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
        const ux = (b[0] - a[0]) / len, uy = (b[1] - a[1]) / len, nx = -uy, ny = ux;
        const big = 3;
        // half-planes either side of the slicing line, clipped to the circle
        [1, -1].forEach(side => {
          const cid = `h${i}_${side}`;
          const cp = el("clipPath", { id: cid }, defs);
          const p0 = [a[0] - ux * big * n, a[1] - uy * big * n], p1 = [a[0] + ux * big * n, a[1] + uy * big * n];
          const q0 = [p1[0] + nx * side * big * n, p1[1] + ny * side * big * n], q1 = [p0[0] + nx * side * big * n, p0[1] + ny * side * big * n];
          el("polygon", { points: [p0, p1, q0, q1].map(p => p.join(",")).join(" ") }, cp);
          const g = el("g", { class: "circle-piece", "clip-path": `url(#${cid})` }, gC);
          el("circle", { cx: c.x, cy: c.y, r: c.r, fill: color, opacity: 0.4 }, g);
          requestAnimationFrame(() => { g.style.transform = `translate(${nx * side * 0.1}px, ${ny * side * 0.1}px)`; });
        });
      } else {
        el("circle", { cx: c.x, cy: c.y, r: c.r, fill: color }, gC);
        if (prevSlices.has(i) && !prevBad) el("circle", { cx: c.x, cy: c.y, r: c.r + 0.07, class: "hint-ring" }, gC);
      }
    });

    // solution overlay
    if (S.showSol) {
      el("polyline", { points: L.solution.map(p => p.join(",")).join(" "), class: "solution" }, svg);
    }

    // dots
    const gD = el("g", {}, svg);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      el("circle", { cx: x, cy: y, r: 0.075, class: "dot" }, gD);
    }

    // path segments
    for (let s = 0; s + 1 < S.path.length; s++) {
      const a = S.path[s], b = S.path[s + 1];
      const isNew = S.newSeg && s === S.path.length - 2;
      el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: "seg" + (isNew ? " new" : "") }, svg);
    }
    S.newSeg = false;

    // preview
    if (S.hover && !S.done && !same(S.hover, last) && !(prevBad === "revisit" && S.path.length > 1 && same(S.hover, S.path[S.path.length - 2]))) {
      el("line", { x1: last[0], y1: last[1], x2: S.hover[0], y2: S.hover[1], class: "preview", stroke: prevBad ? "var(--bad)" : "var(--ink)" }, svg);
    }

    // path vertices
    S.path.forEach(p => el("circle", { cx: p[0], cy: p[1], r: 0.12, fill: "var(--ink)" }, svg));
    // start and end markers
    el("circle", { cx: L.start[0], cy: L.start[1], r: 0.26, class: "start-halo" }, svg);
    el("circle", { cx: L.end[0], cy: L.end[1], r: 0.26, class: "end-ring" }, svg);
    el("circle", { cx: L.end[0], cy: L.end[1], r: 0.12, fill: "var(--bad)" }, svg);
    if (!S.done) el("circle", { cx: last[0], cy: last[1], r: 0.2, fill: "none", stroke: "var(--ink)", "stroke-width": 0.04, class: "next-halo" }, svg);
    if (S.hover && !S.done) el("circle", { cx: S.hover[0], cy: S.hover[1], r: 0.16, fill: "none", stroke: prevBad ? "var(--bad)" : "var(--ink)", "stroke-width": 0.035 }, svg);

    // stats
    const segs = S.path.length - 1, left = L.circles.length - sliced.size;
    $("segCount").textContent = segs;
    $("parCount").textContent = L.par;
    $("leftCount").textContent = left;
    $("undoBtn").disabled = S.path.length <= 1;
    $("resetBtn").disabled = S.path.length <= 1;
    $("solveBtn").setAttribute("aria-pressed", String(S.showSol));
    renderLabel();
    renderWin(sliced);
  }

  function renderWin(sliced) {
    const old = document.querySelector(".win");
    if (old) old.remove();
    const L = S.level;
    if (!S.done || sliced.size < L.circles.length) return;
    const segs = S.path.length - 1;
    const stars = segs <= L.par ? 3 : segs === L.par + 1 ? 2 : 1;
    const box = document.createElement("div");
    box.className = "win";
    const title = segs < L.par ? "Under par!" : segs === L.par ? "Perfect" : "Solved";
    box.innerHTML = `<div><strong>${title} <span class="stars">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</span></strong>
      <small>${segs} line${segs === 1 ? "" : "s"}, par ${L.par}.${segs > L.par ? " Can you find a shorter route?" : ""}</small></div>`;
    const b = document.createElement("button");
    b.type = "button"; b.textContent = segs > L.par ? "Try again" : "Next puzzle";
    // next tick, so the card (and the iPhone haptic label inside it) outlives this tap
    b.onclick = () => setTimeout(() => segs > L.par ? reset() : newPuzzle());
    box.appendChild(b);
    $("boardWrap").after(box);
  }

  const REASONS = {
    cross: "Lines can't cross or touch.",
    revisit: "You've already used that dot.",
    overlap: "That runs back over your last line.",
  };

  function tryAdd(q) {
    if (S.done) return;
    const L = S.level, last = S.path[S.path.length - 1];
    if (same(q, last)) { if (S.path.length > 1) undo(); return; }
    const bad = checkMove(S.path, q);
    if (bad) { SFX.bad?.(); HAPTIC.bad(); setMsg(REASONS[bad] || "That move isn't allowed.", "bad"); render(); return; }
    const before = slicedSet(S.path);
    S.path.push(q); S.newSeg = true;
    const sliced = slicedSet(S.path);
    const left = L.circles.length - sliced.size;
    // sound: a click for the dot, then a slice for each new circle in the order the line meets them
    SFX.tap?.(); HAPTIC.tap();
    const dx = q[0] - last[0], dy = q[1] - last[1], len2 = dx * dx + dy * dy;
    [...sliced.keys()].filter(i => !before.has(i))
      .map(i => ({ i, u: ((L.circles[i].x - last[0]) * dx + (L.circles[i].y - last[1]) * dy) / len2 }))
      .sort((a, b) => a.u - b.u)
      .forEach((c, k) => { const d = 0.05 + Math.max(0, Math.min(1, c.u)) * 0.14 + k * 0.03; SFX.slice?.(before.size + k, d); HAPTIC.slice(before.size + k, d); });
    if (same(q, L.end)) {
      const lines = S.path.length - 1;
      const stars = lines <= L.par ? 3 : lines === L.par + 1 ? 2 : 1;
      if (left === 0) { SFX.win?.(stars); HAPTIC.win(stars); } else { SFX.miss?.(); HAPTIC.miss(); }
    }
    if (same(q, L.end)) {
      S.done = true;
      if (left === 0) {
        setMsg(`Every circle sliced in ${S.path.length - 1} lines.`, "good");
        const k = pkey(L.diff, L.seed), lines = S.path.length - 1;
        if (!progress[k] || lines < progress[k]) { progress[k] = lines; store("lattice.progress", JSON.stringify(progress)); }
      }
      else setMsg(`${left} circle${left === 1 ? "" : "s"} missed. Undo and try again.`, "bad");
    } else {
      setMsg(left === 0 ? "All sliced. Now finish on the red dot." : `${left} circle${left === 1 ? "" : "s"} to go.`);
    }
    render();
  }
  function undo() {
    if (S.path.length <= 1) return;
    SFX.undo?.(); HAPTIC.undo();
    S.path.pop(); S.done = false;
    setMsg("Took back the last line.");
    render();
  }
  function reset() {
    S.path = [S.level.start]; S.done = false; S.hover = null;
    setMsg("Tap dots to draw from green to red.");
    render();
  }
  // ---- free version: 5 fixed puzzles per difficulty, then the unlock ----
  let unlocked = load("lattice.unlocked") === "1";
  let progress = {};
  try { progress = JSON.parse(load("lattice.progress") || "{}") || {}; } catch (e) {}
  const pkey = (d, seed) => `${d}:${seed}`;
  function firstUnsolved(d) {
    const i = FREE_SEEDS.findIndex(sd => !progress[pkey(d, sd)]);
    return i < 0 ? 0 : i;
  }
  function renderLabel() {
    const L = S.level, el = $("puzzleId");
    if (unlocked || S.demoIdx == null) { el.textContent = `Puzzle #${L.seed}`; return; }
    el.innerHTML = `Free<span class="pips" aria-label="Free puzzle ${S.demoIdx + 1} of ${FREE_SEEDS.length}"></span>`;
    const pips = el.querySelector(".pips");
    FREE_SEEDS.forEach((sd, k) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = (progress[pkey(L.diff, sd)] ? "solved" : "") + (k === S.demoIdx ? " current" : "");
      b.setAttribute("aria-label", `Free puzzle ${k + 1}`);
      b.onclick = () => { SFX.ui?.(); HAPTIC.ui(); loadDemo(k); };
      pips.appendChild(b);
    });
  }
  function loadDemo(i) {
    S.demoIdx = i;
    S.level = generate(GRID_SIZE, +$("diffSel").value, FREE_SEEDS[i]);
    S.showSol = false;
    reset();
  }
  function updateLockUI() {
    $("newBtn").textContent = unlocked ? "New puzzle" : "Next puzzle";
    $("titleUnlockBtn").hidden = unlocked;
    $("relockBtn").hidden = !unlocked || STORE.native;   // testing shortcut, web only
  }
  const LOCK_NOTE = STORE.native ? "One-time purchase. Restore it free on any of your devices." : "Demo only. No payment is taken.";
  function lockBusy(busy, note) {
    $("buyBtn").disabled = $("restoreBtn").disabled = busy;
    $("lockNote").textContent = note || LOCK_NOTE;
  }
  function showLock(fromEnd) {
    const name = DIFFS[+$("diffSel").value].name;
    $("lockText").textContent = fromEnd
      ? `You've played all ${FREE_SEEDS.length} free ${name} puzzles. Unlock the full game for endless new ones.`
      : "Get endless new puzzles on every difficulty.";
    $("buyBtn").textContent = `Unlock for ${STORE.price()}`;
    lockBusy(false);
    $("lock").hidden = false;
    $("buyBtn").focus();
    // in the app, fetch the local price; it fills in once the store answers
    if (STORE.native) STORE.init().then(() => { $("buyBtn").textContent = `Unlock for ${STORE.price()}`; }, () => {});
  }
  function hideLock() { $("lock").hidden = true; }
  function setUnlocked(v, note) {
    unlocked = v;
    store("lattice.unlocked", v ? "1" : "0");
    updateLockUI();
    hideLock();
    S.demoIdx = null;
    newPuzzle();
    if (note && !$("app").hidden) setMsg(note, "good");
  }
  // buy or restore through the store, keeping the dialog open with a note on failure
  async function storeAction(act, okNote, noneNote) {
    lockBusy(true, act === STORE.buy ? "Connecting to the store…" : "Checking your purchases…");
    try {
      if (await act()) setUnlocked(true, okNote);
      else lockBusy(false, noneNote);
    } catch (e) {
      lockBusy(false, STORE.cancelled(e) ? "" : (e?.message || "Something went wrong. Please try again."));
    }
  }
  // in the app, the store is the source of truth: pick up a purchase made on another
  // device or a refund, but keep the saved state when the store can't be reached
  function syncOwned() {
    if (!STORE.native) return;
    STORE.owned().then(own => {
      if (own === unlocked) return;
      unlocked = own;
      store("lattice.unlocked", own ? "1" : "0");
      updateLockUI();
      if (!own && S.demoIdx == null) newPuzzle(); else renderLabel();
    }, () => {});
  }

  function newPuzzle(seed) {
    const n = GRID_SIZE, d = +$("diffSel").value;
    if (!unlocked) {
      if (seed != null && FREE_SEEDS.includes(seed)) return loadDemo(FREE_SEEDS.indexOf(seed));
      const next = S.demoIdx == null ? firstUnsolved(d) : S.demoIdx + 1;
      if (next >= FREE_SEEDS.length) { showLock(true); return; }
      return loadDemo(next);
    }
    S.demoIdx = null;
    seed = seed ?? Math.floor(Math.random() * 90000) + 10000;
    S.level = generate(n, d, seed);
    S.showSol = false;
    reset();
  }

  // pointer input: hover/drag previews, release places
  function toLattice(evt) {
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const n = S.level.n;
    const x = Math.round(p.x), y = Math.round(p.y);
    if (x < 0 || y < 0 || x >= n || y >= n) return null;
    if (Math.hypot(p.x - x, p.y - y) > 0.42) return null;
    return [x, y];
  }
  function setHover(h) {
    if ((h && S.hover && same(h, S.hover)) || (!h && !S.hover)) return;
    S.hover = h; render();
  }
  let pressed = false;
  svg.addEventListener("pointerdown", e => { pressed = true; svg.setPointerCapture(e.pointerId); setHover(toLattice(e)); });
  svg.addEventListener("pointermove", e => setHover(toLattice(e)));
  svg.addEventListener("pointerup", e => {
    if (!pressed) return;
    pressed = false;
    const q = toLattice(e);
    if (q) tryAdd(q);
    if (e.pointerType !== "mouse") setHover(null);
  });
  svg.addEventListener("pointercancel", () => { pressed = false; setHover(null); });
  svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") setHover(null); });

  $("undoBtn").onclick = undo;
  $("resetBtn").onclick = () => { SFX.ui?.(); HAPTIC.ui(); reset(); };
  $("newBtn").onclick = () => { SFX.ui?.(); HAPTIC.ui(); newPuzzle(); };
  $("solveBtn").onclick = () => { SFX.ui?.(); HAPTIC.ui(); S.showSol = !S.showSol; render(); };
  function syncSound() {
    ["soundBtn", "soundBtnTitle"].forEach(id => {
      const b = $(id); b.classList.toggle("off", !SFX.on);
      b.setAttribute("aria-label", SFX.on ? "Sound on. Tap to mute" : "Sound off. Tap to turn on");
      b.setAttribute("aria-pressed", String(!!SFX.on));
    });
  }
  ["soundBtn", "soundBtnTitle"].forEach(id => { $(id).onclick = () => { SFX.toggle?.(); syncSound(); }; });
  function syncHap() {
    ["hapBtn", "hapBtnTitle"].forEach(id => {
      const b = $(id); b.hidden = !HAPTIC.supported; b.classList.toggle("off", !HAPTIC.on);
      b.setAttribute("aria-label", HAPTIC.on ? "Vibration on. Tap to turn off" : "Vibration off. Tap to turn on");
      b.setAttribute("aria-pressed", String(HAPTIC.on));
    });
  }
  ["hapBtn", "hapBtnTitle"].forEach(id => { $(id).onclick = () => { HAPTIC.toggle(); SFX.ui?.(); syncHap(); }; });
  syncHap();
  syncSound();
  $("diffSel").onchange = () => { store("lattice.diff", $("diffSel").value); S.demoIdx = null; newPuzzle(); syncDiff(); };

  // difficulty picker: a custom menu over the hidden <select>, which stays the source of truth
  const TICK = '<svg class="tick" viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7"/></svg>';
  function syncDiff() { $("diffVal").textContent = DIFFS[+$("diffSel").value].name; }
  function openDiff() {
    const menu = $("diffMenu"), cur = +$("diffSel").value;
    menu.innerHTML = "";
    DIFFS.forEach((d, i) => {
      const solved = FREE_SEEDS.filter(sd => progress[pkey(i, sd)]).length;
      const meta = unlocked ? `par ${d.par[0]}–${d.par[1]}` : `${solved}/${FREE_SEEDS.length} free`;
      const b = document.createElement("button");
      b.type = "button"; b.className = "diff-opt"; b.setAttribute("role", "option");
      b.setAttribute("aria-selected", String(i === cur));
      b.innerHTML = `<span class="name">${d.name}</span><span class="meta">${meta}</span>${TICK}`;
      b.onclick = () => pickDiff(i);
      menu.appendChild(b);
    });
    menu.hidden = false;
    $("diffBtn").setAttribute("aria-expanded", "true");
    menu.children[cur].focus({ preventScroll: true });
  }
  function closeDiff(focusBtn) {
    if ($("diffMenu").hidden) return;
    $("diffMenu").hidden = true;
    $("diffBtn").setAttribute("aria-expanded", "false");
    if (focusBtn) $("diffBtn").focus({ preventScroll: true });
  }
  function pickDiff(i) {
    closeDiff(true);
    if (i === +$("diffSel").value) return;
    SFX.ui?.(); HAPTIC.ui();
    $("diffSel").value = i;
    $("diffSel").dispatchEvent(new Event("change"));
  }
  $("diffBtn").onclick = () => { SFX.ui?.(); HAPTIC.ui(); $("diffMenu").hidden ? openDiff() : closeDiff(); };
  document.addEventListener("pointerdown", e => { if (!e.target.closest(".stat-diff")) closeDiff(); });
  $("diffMenu").addEventListener("keydown", e => {
    const opts = [...$("diffMenu").children], k = opts.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); opts[Math.min(opts.length - 1, k + 1)].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); opts[Math.max(0, k - 1)].focus(); }
    else if (e.key === "Escape") closeDiff(true);
    else if (e.key === "Tab") closeDiff();
  });
  $("titleUnlockBtn").onclick = () => showLock(false);
  $("relockBtn").onclick = () => { setUnlocked(false); $("titleUnlockBtn").focus(); };
  $("buyBtn").onclick = () => storeAction(STORE.buy, "Unlocked. Enjoy endless puzzles.", "The purchase didn't go through.");
  $("restoreBtn").onclick = () => storeAction(STORE.restore, "Restored. Enjoy endless puzzles.", "No earlier purchase found for this account.");
  $("lockClose").onclick = hideLock;
  $("lock").addEventListener("click", e => { if (e.target === $("lock")) hideLock(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("lock").hidden) hideLock(); });
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key === "z") { e.preventDefault(); undo(); }
  });

  function start(data) {
    const df = load("lattice.diff");
    if (df && $("diffSel").querySelector(`[value="${df}"]`)) $("diffSel").value = df;
    if (data && data.seed) {
      $("diffSel").value = data.diff;
      newPuzzle(data.seed);
      if (data.playing) showGame(false);
      if (Array.isArray(data.path)) { S.path = data.path; S.done = same(S.path[S.path.length - 1], S.level.end) && S.path.length > 1; render(); }
    } else {
      newPuzzle(unlocked ? 24680 : undefined);
    }
    updateLockUI();
    syncDiff();
    syncOwned();
  }
  // title screen <-> game
  function showGame(animate = true) {
    const t = $("titleScreen"), a = $("app");
    const go = () => { t.hidden = true; t.classList.remove("leaving"); a.hidden = false; if (animate) { a.classList.remove("entering"); void a.offsetWidth; a.classList.add("entering"); } };
    if (animate && !matchMedia("(prefers-reduced-motion: reduce)").matches) { t.classList.add("leaving"); setTimeout(go, 280); } else go();
  }
  function showTitle() { $("app").hidden = true; $("titleScreen").hidden = false; }
  $("playBtn").onclick = () => { SFX.ui?.(); HAPTIC.ui(); showGame(); };
  $("homeBtn").onclick = () => { SFX.ui?.(); HAPTIC.ui(); showTitle(); };
  document.querySelectorAll("[data-game-name]").forEach(e => { e.textContent = GAME_NAME; });

  // emblem: a small solved puzzle that draws itself on the title screen
  (function emblem() {
    const L = generate(6, 0, 31337), e = document.getElementById("emblem");
    e.setAttribute("viewBox", "-0.5 -0.5 6 6");
    L.circles.forEach((c, i) => el("circle", { cx: c.x, cy: c.y, r: c.r, fill: PALETTE[i % PALETTE.length], class: "e-circle", style: `animation-delay:${(.4 + i * .35).toFixed(2)}s` }, e));
    for (let y = 0; y < 6; y++) for (let x = 0; x < 6; x++) el("circle", { cx: x, cy: y, r: .07, class: "dot" }, e);
    el("polyline", { points: L.solution.map(p => p.join(",")).join(" "), class: "e-path", pathLength: 1 }, e);
    el("circle", { cx: L.start[0], cy: L.start[1], r: .24, class: "start-halo" }, e);
    el("circle", { cx: L.end[0], cy: L.end[1], r: .24, class: "end-ring" }, e);
    el("circle", { cx: L.end[0], cy: L.end[1], r: .11, fill: "var(--bad)" }, e);
  })();

  window.claude?.hot?.snapshot?.(() => ({ seed: S.level.seed, n: S.level.n, diff: S.level.diff, path: S.path, playing: !$("app").hidden }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

<script>
// ===== HOW TO PLAY: animated slideshow =====
if (typeof document !== "undefined") (function () {
  const NS = "http://www.w3.org/2000/svg";
  const INK = "var(--ink)", BAD = "var(--bad)", GOOD = "var(--good)";
  const COL = ["#ff5a5f", "#3e63dd", "#ffb020", "#12a594", "#8e4ec6"];
  const $ = id => document.getElementById(id);
  const svg = $("tutSvg"), hud = $("tutHud");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let uid = 0;

  const clamp = v => Math.max(0, Math.min(1, v));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const prog = (t, a, b, f = ease) => f(clamp((t - a) / (b - a)));
  const lerp = (a, b, p) => a + (b - a) * p;
  const lerpP = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p)];
  function mk(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const set = (e, attrs) => { for (const k in attrs) e.setAttribute(k, attrs[k]); };

  // ---- reusable pieces ----
  function grid(g, t0 = -1) {
    const dots = [];
    for (let y = 0; y < 4; y++) for (let x = 0; x < 5; x++) dots.push({ e: mk("circle", { cx: x, cy: y, r: .075, fill: INK }, g), d: (x + y) * .07 });
    return t => dots.forEach(o => {
      const p = t0 < 0 ? 1 : prog(t, t0 + o.d, t0 + o.d + .35, easeOut);
      set(o.e, { r: .075 * p, opacity: p });
    });
  }
  function ring(g, at, color, t0) {
    const e = mk("circle", { cx: at[0], cy: at[1], r: .26, fill: "none", stroke: color, "stroke-width": .06 }, g);
    const c = color === BAD ? mk("circle", { cx: at[0], cy: at[1], r: .12, fill: color }, g) : null;
    return t => {
      const p = t0 < 0 ? 1 : prog(t, t0, t0 + .5, easeOut);
      const pulse = t0 >= 0 && t > t0 + .5 ? Math.sin((t - t0 - .5) * 4) * .03 : 0;
      set(e, { r: .26 * p * (1 + pulse * (1 - p) + pulse), opacity: p });
      if (c) set(c, { r: .12 * p });
    };
  }
  // A circle that splits along the line a→b. Returns update(p) where p is 0 (whole) .. 1 (fully split).
  function circle(g, c, color, a, b) {
    const whole = mk("circle", { cx: c.x, cy: c.y, r: c.r, fill: color }, g);
    if (!a) return { whole, update() {} };
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const ux = (b[0] - a[0]) / len, uy = (b[1] - a[1]) / len, nx = -uy, ny = ux, B = 20;
    const halves = [1, -1].map(side => {
      const id = "tc" + (uid++);
      const cp = mk("clipPath", { id }, g);
      const p0 = [a[0] - ux * B, a[1] - uy * B], p1 = [a[0] + ux * B, a[1] + uy * B];
      const pts = [p0, p1, [p1[0] + nx * side * B, p1[1] + ny * side * B], [p0[0] + nx * side * B, p0[1] + ny * side * B]];
      mk("polygon", { points: pts.map(p => p.join(",")).join(" ") }, cp);
      const h = mk("g", { "clip-path": `url(#${id})` }, g);
      mk("circle", { cx: c.x, cy: c.y, r: c.r, fill: color }, h);
      return { h, side };
    });
    return {
      whole,
      update(p) {
        whole.setAttribute("opacity", p > 0 ? 0 : 1);
        halves.forEach(({ h, side }) => {
          h.setAttribute("opacity", p > 0 ? 1 - .6 * p : 0);
          h.setAttribute("transform", `translate(${nx * side * .1 * p} ${ny * side * .1 * p})`);
        });
      },
    };
  }
  function finger(g) {
    const ripple = mk("circle", { r: .2, fill: "none", stroke: INK, "stroke-width": .03, opacity: 0 }, g);
    const f = mk("circle", { r: .2, class: "finger", opacity: 0 }, g);
    // keys: [{t, at}] positions; taps: times
    return (t, keys, taps) => {
      let pos = keys[0].at, vis = prog(t, keys[0].t - .3, keys[0].t, easeOut);
      for (let i = 1; i < keys.length; i++) if (t > keys[i - 1].t) pos = lerpP(keys[i - 1].at, keys[i].at, prog(t, keys[i - 1].t, keys[i].t));
      let press = 0, rp = -1;
      for (const tt of taps) { if (t >= tt - .1 && t < tt + .2) press = Math.sin(clamp((t - tt + .1) / .3) * Math.PI); if (t >= tt && t < tt + .5) rp = (t - tt) / .5; }
      set(f, { cx: pos[0], cy: pos[1], r: .2 * (1 - .2 * press), opacity: vis });
      if (rp >= 0) set(ripple, { cx: pos[0], cy: pos[1], r: .2 + .3 * easeOut(rp), opacity: .6 * (1 - rp) });
      else ripple.setAttribute("opacity", 0);
    };
  }
  // Draws a path segment by segment; circles split when the pen passes through them.
  function pathAnim(g, gC, pts, t0, dur, gap, circles) {
    const segs = [];
    for (let k = 0; k + 1 < pts.length; k++) {
      const a = pts[k], b = pts[k + 1], ts = t0 + k * (dur + gap);
      segs.push({ a, b, ts, line: mk("line", { x1: a[0], y1: a[1], x2: a[0], y2: a[1], stroke: INK, "stroke-width": .075, "stroke-linecap": "round", opacity: 0 }, g) });
    }
    const verts = pts.map(p => mk("circle", { cx: p[0], cy: p[1], r: 0, fill: INK }, g));
    const cs = circles.map((c, i) => {
      for (const s of segs) {
        if (!slices(c, s.a, s.b)) continue;
        const dx = s.b[0] - s.a[0], dy = s.b[1] - s.a[1];
        const u = clamp(((c.x - s.a[0]) * dx + (c.y - s.a[1]) * dy) / (dx * dx + dy * dy));
        let lo = 0, hi = 1;                                  // invert the easing so the split lands as the pen arrives
        for (let j = 0; j < 20; j++) { const m = (lo + hi) / 2; if (ease(m) < u) lo = m; else hi = m; }
        return { o: circle(gC, c, c.color || COL[i % COL.length], s.a, s.b), tc: s.ts + lo * dur };
      }
      return { o: circle(gC, c, c.color || COL[i % COL.length]), tc: Infinity };
    });
    return t => {
      segs.forEach(s => {
        const p = prog(t, s.ts, s.ts + dur);
        const e = lerpP(s.a, s.b, p);
        set(s.line, { x2: e[0], y2: e[1], opacity: p > 0 ? 1 : 0 });
      });
      verts.forEach((v, k) => {
        const tv = k === 0 ? t0 - .2 : segs[k - 1].ts + dur - .05;
        v.setAttribute("r", .12 * prog(t, tv, tv + .2, easeOut));
      });
      cs.forEach(c => c.o.update(prog(t, c.tc, c.tc + .45, easeOut)));
    };
  }
  function cross(g, at) {
    const gx = mk("g", { opacity: 0 }, g);
    mk("circle", { cx: at[0], cy: at[1], r: .24, fill: "var(--paper)", stroke: BAD, "stroke-width": .05 }, gx);
    mk("path", { d: `M${at[0] - .1} ${at[1] - .1}L${at[0] + .1} ${at[1] + .1}M${at[0] + .1} ${at[1] - .1}L${at[0] - .1} ${at[1] + .1}`, stroke: BAD, "stroke-width": .055, "stroke-linecap": "round" }, gx);
    return (p, s = 1) => set(gx, { opacity: p, transform: `translate(${at[0]} ${at[1]}) scale(${.6 + .4 * s}) translate(${-at[0]} ${-at[1]})` });
  }
  function intersect(a, b, c, d) {
    const r = [b[0] - a[0], b[1] - a[1]], s = [d[0] - c[0], d[1] - c[1]];
    const den = r[0] * s[1] - r[1] * s[0];
    const u = ((c[0] - a[0]) * s[1] - (c[1] - a[1]) * s[0]) / den;
    return [a[0] + u * r[0], a[1] + u * r[1]];
  }
  function setHud(html) { if (hud.innerHTML !== html) hud.innerHTML = html; hud.hidden = !html; }

  // ---- the slides ----
  const SLIDES = [
    {
      cap: "Every puzzle runs from the green start to the red finish.",
      period: 4.6,
      build(g) {
        const gr = grid(g, .1), s = ring(g, [0, 3], GOOD, 1.1), e = ring(g, [4, 0], BAD, 1.7);
        const hint = mk("path", { d: "M0 3 Q 1.2 0.6 4 0", fill: "none", stroke: INK, "stroke-width": .035, "stroke-dasharray": ".1 .1", opacity: 0 }, g);
        hint.setAttribute("pathLength", 1);
        set(hint, { "stroke-dasharray": "1 1" });
        return t => {
          gr(t); s(t); e(t);
          const p = prog(t, 2.3, 3.4);
          set(hint, { opacity: p > 0 ? .35 : 0, "stroke-dashoffset": 1 - p });
        };
      },
    },
    {
      cap: "Tap a dot to draw a straight line to it.",
      period: 5.2,
      build(g) {
        const gr = grid(g), s = ring(g, [0, 3], GOOD, -1), e = ring(g, [4, 0], BAD, -1);
        const gc = mk("g", {}, g);
        const pa = pathAnim(g, gc, [[0, 3], [2, 1], [4, 2]], 1.55, .55, 1.0, []);
        const f = finger(g);
        return t => {
          gr(t); s(t); e(t); pa(t);
          f(t, [{ t: .5, at: [4.4, 3.4] }, { t: 1.3, at: [2, 1] }, { t: 2.4, at: [2, 1] }, { t: 3.0, at: [4, 2] }, { t: 4.2, at: [4.5, 3.6] }], [1.45, 3.05]);
        };
      },
    },
    {
      cap: "Slice through every coloured circle.",
      period: 5,
      build(g) {
        const gr = grid(g), gc = mk("g", {}, g);
        const circles = [{ x: .5, y: 2.3, r: .3 }, { x: 1.5, y: .75, r: .3 }, { x: 3.5, y: 2.3, r: .3, color: COL[3] }];
        const s = ring(g, [0, 3], GOOD, -1);
        const pa = pathAnim(g, gc, [[0, 3], [2, 0], [4, 3]], .6, 1.0, .35, circles);
        const e = ring(g, [4, 3], BAD, -1);
        return t => { gr(t); s(t); pa(t); e(t); };
      },
    },
    {
      cap: "Grazing the edge doesn't count. Cut right through.",
      period: 5.4,
      build(g) {
        const gr = grid(g), gc = mk("g", {}, g);
        const c = { x: 1.5, y: 1.55, r: .45, color: COL[4] };
        const graze = mk("line", { x1: 0, y1: 2, x2: 0, y2: 2, stroke: INK, "stroke-width": .075, "stroke-linecap": "round" }, g);
        const pa = pathAnim(g, gc, [[0, 2], [3, 1]], 2.7, .9, 0, [c]);
        const wob = gc.firstChild;   // the whole circle
        const x = cross(g, [3.2, 2]);
        const s = ring(g, [0, 2], GOOD, -1);
        return t => {
          gr(t); s(t);
          const p = prog(t, .5, 1.4), out = prog(t, 2.0, 2.4);
          set(graze, { x2: lerp(0, 4, p), opacity: p > 0 ? 1 - out : 0, stroke: t > 1.4 ? BAD : INK });
          const w = t > 1.3 && t < 1.9 ? Math.sin((t - 1.3) * 30) * .04 * (1 - (t - 1.3) / .6) : 0;
          wob.setAttribute("transform", `translate(${w} 0)`);
          x(prog(t, 1.35, 1.6, easeOut) * (1 - out), prog(t, 1.35, 1.6, easeOut));
          pa(t);
        };
      },
    },
    {
      cap: "Lines can never cross or touch each other.",
      period: 5.6,
      build(g) {
        const gr = grid(g), gc = mk("g", {}, g);
        const pts = [[0, 3], [2, 0], [4, 3]];
        const s = ring(g, [0, 3], GOOD, -1);
        const pa = pathAnim(g, gc, pts, -2, .01, 0, []);
        const bad = mk("line", { x1: 4, y1: 3, x2: 4, y2: 3, stroke: BAD, "stroke-width": .05, "stroke-dasharray": ".12 .12", "stroke-linecap": "round" }, g);
        const at = intersect([4, 3], [0, 1], [0, 3], [2, 0]);
        const x = cross(g, at);
        const good = mk("line", { x1: 4, y1: 3, x2: 4, y2: 3, stroke: INK, "stroke-width": .075, "stroke-linecap": "round" }, g);
        const gv = mk("circle", { cx: 4, cy: 0, r: 0, fill: INK }, g);
        const f = finger(g);
        return t => {
          gr(t); s(t); pa(t);
          const p = prog(t, .9, 1.4), out = prog(t, 2.5, 2.9);
          const e = lerpP([4, 3], [0, 1], p);
          set(bad, { x2: e[0], y2: e[1], opacity: p > 0 ? 1 - out : 0 });
          x(prog(t, 1.3, 1.55, easeOut) * (1 - out), prog(t, 1.3, 1.55, easeOut));
          const q = prog(t, 3.6, 4.1);
          set(good, { y2: lerp(3, 0, q), opacity: q > 0 ? 1 : 0 });
          gv.setAttribute("r", .12 * prog(t, 4.05, 4.25, easeOut));
          f(t, [{ t: .4, at: [4.4, 3.5] }, { t: .9, at: [0, 1] }, { t: 2.6, at: [0, 1] }, { t: 3.4, at: [4, 0] }, { t: 4.6, at: [4.5, -.4] }], [3.5]);
        };
      },
    },
    {
      cap: "Use as few lines as you can. Match par for three stars.",
      period: 7.4,
      build(g) {
        const circles = [{ x: .5, y: 2.3, r: .3 }, { x: 1.5, y: .75, r: .3 }, { x: 3.5, y: 2.3, r: .3, color: COL[3] }];
        const gr = grid(g);
        const gA = mk("g", {}, g), gB = mk("g", { opacity: 0 }, g);
        const cA = mk("g", {}, gA), cB = mk("g", {}, gB);
        const rA = [[0, 3], [1, 1], [1, 0], [4, 3]], rB = [[0, 3], [2, 0], [4, 3]];
        const pA = pathAnim(gA, cA, rA, .5, .55, .2, circles);
        const pB = pathAnim(gB, cB, rB, 4.0, .7, .25, circles);
        const s = ring(g, [0, 3], GOOD, -1), e = ring(g, [4, 3], BAD, -1);
        const endsA = [0, 1, 2].map(k => .5 + k * .75 + .55), endsB = [0, 1].map(k => 4 + k * .95 + .7);
        return t => {
          gr(t); pA(t); pB(t); s(t); e(t);
          const swap = prog(t, 3.0, 3.6);
          gA.setAttribute("opacity", 1 - swap); gB.setAttribute("opacity", swap);
          const nA = endsA.filter(x => t >= x).length, nB = endsB.filter(x => t >= x).length;
          if (t < 3.3) setHud(nA ? `${nA} line${nA > 1 ? "s" : ""} · par 2${nA === 3 ? ` <span class="gold">★★☆</span>` : ""}` : "par 2");
          else setHud(nB ? `${nB} line${nB > 1 ? "s" : ""} · par 2${nB === 2 ? ` <span class="gold">★★★</span>` : ""}` : "par 2");
        };
      },
    },
  ];

  // ---- runner ----
  let idx = 0, update = null, t0 = 0, raf = 0;
  function show(i) {
    idx = Math.max(0, Math.min(SLIDES.length - 1, i));
    const sl = SLIDES[idx];
    svg.textContent = ""; setHud("");
    const g = mk("g", {}, svg);
    update = sl.build(g);
    t0 = performance.now();
    const cap = $("tutCap");
    cap.textContent = sl.cap;
    cap.classList.remove("enter"); void cap.offsetWidth; cap.classList.add("enter");
    $("tutStep").textContent = `${idx + 1} / ${SLIDES.length}`;
    $("tutPrev").disabled = idx === 0;
    const last = idx === SLIDES.length - 1, nb = $("tutNext");
    nb.className = last ? "primary tut-play" : "tut-arrow primary";
    const tap = nb.querySelector(":scope > label.hap-tap");   // keep the iPhone haptic overlay
    nb.innerHTML = last ? "Let's play" : `<svg viewBox="0 0 20 20"><path d="M7.5 4l6 6-6 6"/></svg>`;
    if (tap) nb.appendChild(tap);
    nb.setAttribute("aria-label", last ? "Close and play" : "Next");
    [...$("tutDots").children].forEach((d, k) => d.classList.toggle("on", k === idx));
    frame();
  }
  function frame() {
    cancelAnimationFrame(raf);
    const sl = SLIDES[idx];
    let t = (performance.now() - t0) / 1000;
    if (reduced) t = sl.period - .5;
    else t %= sl.period;
    const fade = reduced ? 1 : Math.min(prog(t, 0, .3, x => x), 1 - prog(t, sl.period - .45, sl.period, x => x));
    svg.firstChild.setAttribute("opacity", fade);
    update(t);
    if (!reduced && !$("tut").hidden) raf = requestAnimationFrame(frame);
  }
  let opener = null;
  function open() {
    opener = document.activeElement;
    $("tut").hidden = false;
    show(0);
    $("tutNext").focus();
  }
  function close() {
    $("tut").hidden = true;
    cancelAnimationFrame(raf);
    try { localStorage.setItem("lattice.seenHelp", "1"); } catch (e) {}
    if (opener && opener.focus) opener.focus();
  }

  SLIDES.forEach((_, k) => {
    const d = document.createElement("button");
    d.type = "button"; d.setAttribute("aria-label", `Slide ${k + 1}`);
    d.onclick = () => show(k);
    $("tutDots").appendChild(d);
  });
  $("helpBtn").onclick = () => { SFX.ui?.(); HAPTIC.ui(); open(); };
  $("titleHelpBtn").onclick = () => { SFX.ui?.(); HAPTIC.ui(); open(); };
  $("tutClose").onclick = close;
  $("tutPrev").onclick = () => { SFX.ui?.(); HAPTIC.ui(); show(idx - 1); };
  $("tutNext").onclick = () => { SFX.ui?.(); HAPTIC.ui(); idx === SLIDES.length - 1 ? close() : show(idx + 1); };
  $("tut").addEventListener("click", e => { if (e.target === $("tut")) close(); });
  document.addEventListener("keydown", e => {
    if ($("tut").hidden) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowRight") $("tutNext").click();
    else if (e.key === "ArrowLeft" && idx > 0) show(idx - 1);
  });
  let sx = null;
  $("tutStage").addEventListener("pointerdown", e => { sx = e.clientX; });
  $("tutStage").addEventListener("pointerup", e => {
    if (sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if (dx < -40) $("tutNext").click(); else if (dx > 40 && idx > 0) show(idx - 1);
  });

})();
</script>
